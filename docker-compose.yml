version: '3.8'

services:
  auth-postgres:
    image: postgres:latest
    container_name: auth-service-db
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5001:5432"
    networks:
      - internal
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  postgres:
    image: postgres:latest
    container_name: patient-service-db
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5000:5432"
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data

  admin-postgres:
    image: postgres:latest
    container_name: admin-service-db
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: admin_service_db
    ports:
      - "5002:5432"
    networks:
      - internal
    volumes:
      - admin_postgres_data:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    environment:
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_KRAFT_CLUSTER_ID: kraft-cluster
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
      - "9094:9094"
    networks:
      - internal
    volumes:
      - kafka_data:/bitnami/kafka

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gatewayadmin-service-db
    ports:
      - "4004:4004"
    environment:
      AUTH_SERVICE_URL: http://auth-service:4005
    networks:
      - internal
  analytics-service:
    build:
      context: ./analytics-service
    container_name: analytics-service
    ports:
      - "4002:4002"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - internal

  billing-service:
    build:
      context: ./billing-service
    container_name: billing-service
    ports:
      - "4001:4001"
      - "9001:9001"
    networks:
      - internal

  patient-service:
    build:
      context: ./patient-service
    container_name: patient-service
    depends_on:
      - postgres
      - billing-service
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # ports:
    #   - "4000:4000"
    networks:
      - internal


  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    depends_on:
      - auth-postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: Y7YxPj4tSxG5UvHjWkzvRr2xMqL9TnEvZbNcXoUwQeDfGhHiJkLmNoPqRsTuVwXy
    # ports:      SPRING_DATASOURCE_URL: jdbc:postgresql://admin-service-db:5432/admin_service_db

    #   -"4005:4005"
    networks:
      - internal

  admin-service:
      build:
        context: ./admin-service
      container_name: admin-service
      depends_on:
        - postgres
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://admin-service-db:5432/admin_service_db
        SPRING_DATASOURCE_USERNAME: admin_user
        SPRING_DATASOURCE_PASSWORD: password
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
        SPRING_SQL_INIT_MODE: always
      ports:
        - "4006:4006"
      networks:
        - internal

networks:
  internal:


volumes:
  postgres_data:
  kafka_data:
  auth_postgres_data:
  admin_postgres_data:
